name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash
      - name: Lint
        run: pnpm lint
        shell: bash
      - name: Typecheck
        run: pnpm typecheck
        shell: bash
      - name: Unit tests
        run: pnpm test
        shell: bash
      - name: Package tools
        run: pnpm tools:package
        shell: bash
      - name: Smoke test
        run: pnpm smoke DB FTS5_MAIN FTS5_UTILITY TOOLS
        shell: bash
      - name: End-to-end tests
        run: pnpm test:e2e
        shell: bash
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
