appId: dev.lensdesk.app
productName: LensDesk
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
extraResources:
  - from: resources/keys
    to: keys
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
publish: null
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: true
  perMachine: false
